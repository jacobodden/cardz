<!doctype html>
<html lang="en" data-palette="felt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1e6b4e" />
    <title>Cardz</title>
    <script>
      // Runs before first paint so the saved theme and mode never flash.
      // The `themes` object is injected by vite.config.ts from src/themes.ts.
      (function () {
        var themes = __THEMES__;
        var root = document.documentElement;
        var palette = null;
        var mode = null;
        try {
          palette = localStorage.getItem(themes.storageKey);
          mode = localStorage.getItem('theme');
        } catch (e) {}
        if (!Object.prototype.hasOwnProperty.call(themes.colors, palette)) palette = themes.defaultId;
        root.setAttribute('data-palette', palette);
        var dark = mode === 'dark' || (!mode && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) root.classList.add('dark');
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', themes.colors[palette][dark ? 'dark' : 'light']);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
